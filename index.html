<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>حلوى النجوم ⭐ - نظام المعارك الاحترافي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="starfield"></div>

<div class="sidebar" id="sidebar">
    <button class="sidebar-close" onclick="window.toggleSidebar()">❌</button>
    <div class="players-title">🏆 المتصدرون والمنافسون</div>
    <input type="text" id="searchPlayerInput" class="search-bar" placeholder="ابحث عن اسم لاعب..." onkeyup="window.filterPlayers()" />
    <div class="filter-tabs">
        <button onclick="window.setFilterTab('all')" class="tab-btn active-tab" id="tabAll">الكل</button>
        <button onclick="window.setFilterTab('online')" class="tab-btn" id="tabOnline">المتصلون الآن</button>
    </div>
    <div id="playersList" class="players-container"></div>
</div>

<div class="user-bar">
    <div class="user-dropdown-container" id="userProfileBox" onclick="window.toggleProfileMenu(event)">
        <span><span id="playerFlag">🌍</span> <span id="playerName">لاعب</span> <span class="dropdown-arrow">▼</span></span>
        <div id="userMenu" class="user-menu-dropdown hidden">
            <span class="um-name" id="umName">لاعب</span>
            <span class="um-level">المستوى: <strong id="umLevel">1</strong></span>
            <div class="um-progress-box">
                <span class="um-progress-text">مباريات للمستوى القادم: <span id="umMatchesLeft">5</span></span>
                <div class="um-progress-bar-container"><div id="umProgressBar" class="um-progress-bar"></div></div>
            </div>
            <hr />
            <button class="um-btn" onclick="window.editUserName(event)">تعديل الاسم ✎</button>
            <button class="um-btn" onclick="window.editPassword(event)">تعديل كلمة المرور 🔒</button>
        </div>
    </div>
    <div class="action-btns">
        <button class="btn-small btn-support" id="supportBtn" onclick="window.claimSupport()">دعم 🆘</button>
        <button class="btn-small btn-achievements" id="achBtn" onclick="window.openAchievements()">إنجازات 🏅</button>
        <button class="btn-small btn-challenges" id="challengesBtn" onclick="window.openDailyChallenges()">تحديات 🎯</button>
        <button class="btn-small btn-spin" id="spinBtn" onclick="window.openSpinWheel()">عجلة الحظ 🎨</button>
        <button style="background:linear-gradient(135deg,#9b59b6,#6c2f8c);" class="btn-small" id="randomBtn" onclick="window.startRandomMatch()">عشوائي 🎲</button>
        <button class="btn-small btn-menu" id="menuBtn" onclick="window.toggleSidebar()">المنافسون 👥</button>
        <button class="btn-small btn-logout" id="logoutBtn" onclick="window.logout()">خروج</button>
        <button class="btn-small btn-surrender" id="surrenderBtn" onclick="window.surrenderBattle()">انسحاب 🏳</button>
    </div>
</div>

<div class="header">
    <div class="info-box">
        <div class="label">الحركات</div>
        <div class="value" id="movesDisplay">25</div>
    </div>
    <div class="info-box" id="wagerBox" style="display:none;">
        <div class="label">الرهان</div>
        <div class="value wager-color" id="wagerDisplay">⭐0</div>
    </div>
    <div class="info-box" id="scoreWrapper">
        <div class="label" id="scoreLabel">رصيد النجوم</div>
        <div class="value money-color" id="scoreDisplay">⭐0</div>
    </div>
    <div class="info-box" id="targetWrapper">
        <div class="label" id="targetLabel">المستوى</div>
        <div class="value target-color" id="targetDisplay">1</div>
    </div>
</div>

<div class="game-area">
    <div class="grid" id="grid"></div>
    <div class="skill-bar" id="skillBar" style="display:none;">
        <button class="skill-btn" id="ultimateBtn" onclick="window.useUltimateStrike()">⚡ الضربة الساحقة (⭐50)</button>
    </div>
</div>

<button class="chat-btn-float" id="chatBtn" onclick="window.toggleChat()">💬<span class="chat-badge" id="chatBadge"></span></button>
<div class="chat-preview-bubble hidden" id="chatPreviewBubble"></div>

<div class="chat-panel" id="chatPanel">
    <div class="chat-header"><span>دردشة المعركة</span><button class="close-chat" onclick="window.toggleChat()">❌</button></div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="stickers-bar">
        <button class="stk-btn" onclick="window.sendChat('😂', true)">😂</button>
        <button class="stk-btn" onclick="window.sendChat('😭', true)">😭</button>
        <button class="stk-btn" onclick="window.sendChat('😡', true)">😡</button>
        <button class="stk-btn" onclick="window.sendChat('😍', true)">😍</button>
        <button class="stk-btn" onclick="window.sendChat('👍', true)">👍</button>
        <button class="stk-btn" onclick="window.sendChat('👎', true)">👎</button>
        <button class="stk-btn" onclick="window.sendChat('💀', true)">💀</button>
        <button class="stk-btn" onclick="window.sendChat('🎉', true)">🎉</button>
    </div>
    <div class="chat-controls">
        <input type="text" id="chatInput" class="chat-input" placeholder="رسالة..." onkeypress="if(event.key === 'Enter') window.submitTextChat()" />
        <button class="chat-send" onclick="window.submitTextChat()">➡</button>
    </div>
</div>

<div id="dynamicModal" class="modal hidden">
    <div class="modal-content">
        <h2 id="dmTitle" class="modal-title">العنوان</h2>
        <div id="dmBody" class="modal-body">الرسالة</div>
        <input type="text" id="dmInput1" class="modal-input" style="display:none;" />
        <input type="password" id="dmInput2" class="modal-input" style="display:none;" />
        <div class="modal-btn-group" id="dmBtnGroup">
            <button id="dmConfirmBtn" class="btn-primary">موافق ✅</button>
            <button id="dmCancelBtn" class="btn-secondary" style="display:none;">إلغاء ❌</button>
        </div>
    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
