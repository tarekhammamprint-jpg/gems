<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>حلوى النجوم ⭐ - نظام المعارك الاحترافي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{
        --bg-deep:#160a2e; --bg-mid:#2a1454; --bg-glow:#4b1e78;
        --gold:#ffc94d; --gold-soft:#ffe9b0;
        --pink:#ff3d78; --pink-glow:#ff6fa3;
        --mint:#00e6a8; --mint-soft:#8affd6;
        --sky:#3fb8ff;
        --ink:#f5f0ff; --ink-dim:#c9bfe6;
        --card:rgba(255,255,255,0.06); --card-brd:rgba(255,255,255,0.14);
        --danger:#ff4d5e;
    }
    *{box-sizing:border-box;}
    body{
        margin:0; padding:0; min-height:100vh;
        background:
            radial-gradient(ellipse 80% 50% at 20% -10%, var(--bg-glow), transparent 60%),
            radial-gradient(ellipse 60% 40% at 90% 10%, #ff3d7833, transparent 60%),
            radial-gradient(circle at 50% 100%, var(--bg-mid), var(--bg-deep) 70%);
        display:flex; flex-direction:column; align-items:center;
        font-family:'Cairo', sans-serif; color:var(--ink);
        touch-action:manipulation; -webkit-user-select:none; user-select:none;
        overflow-x:hidden; position:relative;
    }
    .display-font{ font-family:'Lalezar', 'Cairo', sans-serif; letter-spacing:0.5px;}
    #starfield{ position:fixed; inset:0; z-index:0; pointer-events:none; }
    .star-dot{ position:absolute; background:#fff; border-radius:50%; opacity:0.6; animation:twinkle 3s ease-in-out infinite; }
    @keyframes twinkle{ 0%,100%{opacity:.15; transform:scale(1);} 50%{opacity:.9; transform:scale(1.4);} }

    .user-bar{ width:100%; max-width:480px; display:flex; justify-content:space-between; align-items:center; padding:10px 8px; background:rgba(10,5,25,0.55); box-sizing:border-box; border-bottom:1px solid var(--card-brd); z-index:50; position:relative; backdrop-filter:blur(10px);}
    .action-btns{ display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end;}
    .btn-small{ color:white; border:none; padding:7px 9px; border-radius:8px; cursor:pointer; font-weight:700; font-size:12px; transition:transform 0.12s, filter .15s; font-family:'Cairo',sans-serif;}
    .btn-small:active{ transform:scale(0.9); filter:brightness(1.15);}
    .btn-menu{ background:linear-gradient(135deg,#3fb8ff,#2176c7);}
    .btn-logout{ background:linear-gradient(135deg,#ff4d5e,#c92836);}
    .btn-spin{ background:linear-gradient(135deg,#ffb347,#e67e22);}
    .btn-challenges{ background:linear-gradient(135deg,#00e6a8,#00a884);}
    .btn-achievements{ background:linear-gradient(135deg,#9b59b6,#6c2f8c);}
    .btn-surrender{ background:linear-gradient(135deg,#ff9800,#c96f00); display:none;}
    .btn-support{ background:linear-gradient(135deg,#ffb347,#e67e22); display:none; animation:pulseWager 1.5s infinite;}

    .user-dropdown-container{ display:flex; align-items:center; position:relative; cursor:pointer; padding:6px 10px; background:rgba(255,255,255,0.08); border-radius:10px; transition:background .2s; border:1px solid var(--card-brd);}
    .user-dropdown-container:hover{ background:rgba(255,255,255,0.16);}
    .user-dropdown-container span{ font-size:15px; font-weight:800; color:var(--mint-soft);}
    .user-menu-dropdown{
        position:absolute; top:115%; left:0; background:rgba(20,10,45,0.98);
        border:2px solid var(--gold); border-radius:14px; padding:16px;
        width:240px; z-index:300; display:flex; flex-direction:column; gap:10px;
        box-shadow:0 15px 40px rgba(0,0,0,0.7); backdrop-filter:blur(10px);
        transition:opacity .2s, transform .2s; transform-origin:top left;
    }
    .user-menu-dropdown.hidden{ opacity:0; transform:scale(0.85); pointer-events:none;}
    .um-name{ font-size:22px !important; font-weight:800; color:var(--gold) !important; text-align:center; display:block !important; margin-bottom:4px; font-family:'Lalezar',sans-serif;}
    .um-level{ font-size:14px !important; color:var(--mint-soft) !important; text-align:center; display:block !important;}
    .um-progress-box{ background:rgba(0,0,0,0.4); padding:9px; border-radius:10px; border:1px solid var(--sky); text-align:center;}
    .um-progress-text{ font-size:12px !important; color:#ddd !important; display:block !important;}
    .um-progress-bar-container{ width:100%; background:#2a1d44; border-radius:10px; height:10px; margin-top:6px; overflow:hidden;}
    .um-progress-bar{ height:100%; background:linear-gradient(90deg,var(--mint),var(--sky)); width:0%; transition:width .3s;}
    .user-menu-dropdown hr{ width:100%; border-color:var(--card-brd); margin:4px 0; border-style:solid;}
    .um-btn{ background:rgba(255,255,255,0.08); border:1px solid var(--sky); color:white; padding:9px; border-radius:8px; cursor:pointer; transition:background .2s; font-weight:700; font-size:13px; font-family:'Cairo',sans-serif;}
    .um-btn:hover{ background:rgba(63,184,255,0.35);}

    .sidebar{ position:fixed; right:-300px; top:0; width:280px; height:100%; background:rgba(14,8,32,0.97); border-left:2px solid var(--sky); transition:right .3s ease; z-index:200; padding:18px; box-sizing:border-box; box-shadow:-8px 0 25px rgba(0,0,0,0.6); backdrop-filter:blur(8px); display:flex; flex-direction:column;}
    .sidebar.open{ right:0;}
    .sidebar-close{ position:absolute; top:10px; left:10px; background:none; border:none; color:white; font-size:20px; cursor:pointer;}
    .players-title{ font-size:17px; margin-bottom:10px; color:var(--gold); font-weight:800; border-bottom:1px solid var(--card-brd); padding-bottom:10px; margin-top:22px; font-family:'Lalezar',sans-serif;}
    .search-bar{ width:100%; padding:9px; margin-bottom:10px; border-radius:8px; border:1px solid var(--sky); background:rgba(0,0,0,0.4); color:white; outline:none; box-sizing:border-box; font-family:'Cairo',sans-serif;}
    .filter-tabs{ display:flex; width:100%; gap:5px; margin-bottom:10px;}
    .tab-btn{ flex:1; padding:8px; border:1px solid var(--sky); background:rgba(0,0,0,0.4); color:white; border-radius:8px; cursor:pointer; font-weight:700; font-size:12px; transition:background .2s; font-family:'Cairo',sans-serif;}
    .tab-btn.active-tab{ background:var(--sky); color:#fff;}
    .players-container{ overflow-y:auto; flex-grow:1; padding-right:5px;}
    .player-row{ display:flex; flex-direction:column; background:var(--card); margin-bottom:8px; padding:10px; border-radius:10px; position:relative; border:1px solid var(--card-brd);}
    .p-name{ font-size:14px; font-weight:800; margin-bottom:2px; display:flex; align-items:center; flex-wrap:wrap;}
    .p-title{ font-size:10px; color:#aaa; margin-right:5px; font-weight:400;}
    .p-score{ font-size:14px; color:var(--mint-soft); font-weight:700; margin-bottom:8px;}
    .btn-group{ display:flex; gap:5px;}
    .challenge-btn{ background:linear-gradient(135deg,var(--mint),#00a884); color:#012; border:none; padding:6px; border-radius:8px; font-weight:800; cursor:pointer; font-size:12px; flex:1; font-family:'Cairo',sans-serif;}
    .gift-btn{ background:linear-gradient(135deg,#9b59b6,#6c2f8c); color:#fff; border:none; padding:6px; border-radius:8px; font-weight:800; cursor:pointer; font-size:12px; flex:1; font-family:'Cairo',sans-serif;}
    .admin-controls{ display:flex; gap:5px; margin-top:5px; border-top:1px solid var(--card-brd); padding-top:5px;}
    .ban-btn{ background:#7f8c8d; color:#fff; border:none; padding:5px; border-radius:6px; font-weight:700; cursor:pointer; font-size:11px; flex:1;}
    .del-btn{ background:#c0392b; color:#fff; border:none; padding:5px; border-radius:6px; font-weight:700; cursor:pointer; font-size:11px; flex:1;}
    .banned-text{ color:var(--danger); font-size:12px; font-weight:700;}
    .status-dot{ height:10px; width:10px; border-radius:50%; display:inline-block; margin-right:8px;}
    .online{ background-color:var(--mint); box-shadow:0 0 6px var(--mint);}
    .offline{ background-color:#777;}

    .header{ display:flex; width:100%; max-width:480px; justify-content:space-around; padding:10px 0; background:var(--card); margin-bottom:14px; margin-top:6px; border-radius:14px; position:relative; z-index:20; border:1px solid var(--card-brd);}
    .info-box{ text-align:center; padding:5px; border-radius:10px; transition:transform .3s;}
    .info-box.highlight{ background:rgba(0,230,168,0.28); transform:scale(1.1); box-shadow:0 0 18px var(--mint);}
    .info-box.lose-highlight{ background:rgba(255,61,120,0.28); transform:scale(0.9); box-shadow:0 0 18px var(--pink);}
    .label{ font-size:12px; opacity:0.75; margin-bottom:2px;}
    .value{ font-size:20px; font-weight:800; color:var(--gold); text-shadow:0 2px 6px rgba(0,0,0,0.5); font-family:'Lalezar',sans-serif;}
    .money-color{ color:var(--mint-soft);}
    .wager-color{ color:var(--pink); text-shadow:0 0 8px var(--pink); animation:pulseWager 1.5s infinite;}
    .vs-mode{ color:var(--pink); animation:pulse .5s infinite alternate;}
    @keyframes pulse{ from{transform:scale(1);} to{transform:scale(1.1);} }
    @keyframes pulseWager{ 0%{opacity:1;} 50%{opacity:.7;} 100%{opacity:1;} }

    .game-area{ display:flex; flex-direction:column; justify-content:center; align-items:center; width:100vw; position:relative; z-index:5;}

    .grid{
        display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); gap:3px;
        width:95vw; max-width:340px; height:95vw; max-height:340px;
        background:rgba(0,0,0,0.35); border-radius:16px; padding:7px;
        box-sizing:border-box; box-shadow:0 0 40px rgba(0,0,0,0.7), inset 0 0 12px rgba(255,255,255,0.08);
        border:2px solid var(--card-brd); position:relative; touch-action:none;
    }
    .grid div{
        width:100%; height:100%; margin:0; background-size:88%; background-repeat:no-repeat; background-position:center;
        transition:transform 0.2s cubic-bezier(0.175,0.885,0.32,1.275), opacity 0.2s;
        border-radius:9px; -webkit-tap-highlight-color:transparent; box-sizing:border-box; pointer-events:auto; touch-action:none;
    }
    .grid div:active{ transform:scale(0.85);}
    .grid .selected{ background-color:rgba(255,255,255,0.22); box-shadow:0 0 18px #fff, inset 0 0 10px #fff; transform:scale(1.1); z-index:10;}
    .fade-out{ opacity:0; transform:scale(0);}
    @keyframes candyPop{ 0%{transform:scale(0); opacity:0;} 70%{transform:scale(1.15); opacity:1;} 100%{transform:scale(1); opacity:1;} }
    .grid div.new-candy{ animation:candyPop .4s ease-out forwards;}
    @keyframes invalidShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
    .grid div.invalid-move{ animation:invalidShake .35s ease-in-out; }

    .floating-reward{ position:absolute; color:var(--mint-soft); font-size:26px; font-weight:900; text-shadow:0 0 15px var(--mint), 2px 2px 5px #000; z-index:100; pointer-events:none; animation:floatUp 1s ease-out forwards; font-family:'Lalezar',sans-serif;}
    .floating-reward.combo{ color:var(--gold); text-shadow:0 0 18px var(--gold), 2px 2px 5px #000; font-size:32px;}
    @keyframes floatUp{ 0%{opacity:1; transform:translateY(0) scale(1);} 100%{opacity:0; transform:translateY(-65px) scale(1.6);} }
    .trophy-icon{ font-size:80px; animation:popSticker .6s cubic-bezier(0.175,0.885,0.32,1.275); text-shadow:0 0 30px var(--gold); margin:10px 0;}
    @keyframes popSticker{ 0%{transform:scale(0) rotate(-20deg);} 60%{transform:scale(1.2) rotate(8deg);} 100%{transform:scale(1) rotate(0);} }

    .skill-bar{ display:none; justify-content:center; width:95vw; max-width:340px; margin-top:15px; gap:8px;}
    .skill-btn{ width:100%; background:linear-gradient(90deg,#9b59b6,#c0392b); border:2px solid var(--gold); color:#fff; padding:12px; border-radius:10px; font-weight:800; cursor:pointer; transition:transform .1s; font-size:15px; text-shadow:1px 1px 2px #000; box-shadow:0 4px 18px rgba(0,0,0,0.5); font-family:'Cairo',sans-serif;}
    .skill-btn:active{ transform:scale(0.95);}
    .skill-btn:disabled{ background:#403a4d; border-color:#333; color:#888; cursor:not-allowed; box-shadow:none; text-shadow:none;}

    .chat-btn-float{ position:fixed; bottom:20px; right:20px; background:linear-gradient(135deg,var(--sky),#2176c7); color:white; border:none; border-radius:50%; width:56px; height:56px; font-size:24px; box-shadow:0 6px 18px rgba(0,0,0,0.6); cursor:pointer; z-index:60; display:none; transition:transform .2s;}
    .chat-btn-float:active{ transform:scale(0.9);}
    .chat-badge{ position:absolute; top:-2px; left:-2px; background:var(--pink); width:16px; height:16px; border-radius:50%; border:2px solid var(--bg-deep); display:none;}
    .chat-preview-bubble{ position:fixed; right:20px; color:#fff; font-size:14px; z-index:55; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:1; transform:translateY(0); transition:opacity .3s, transform .3s; pointer-events:none; border-radius:14px; border-bottom-right-radius:2px; padding:10px 15px;}
    .chat-preview-bubble.hidden{ opacity:0; transform:translateY(15px);}

    .chat-panel{ position:fixed; bottom:85px; right:10px; width:calc(100vw - 20px); max-width:320px; height:380px; background:rgba(18,10,40,0.97); border:2px solid var(--sky); border-radius:16px; z-index:60; display:flex; flex-direction:column; display:none; box-shadow:0 15px 40px rgba(0,0,0,0.7); backdrop-filter:blur(10px); overflow:hidden;}
    .chat-header{ background:rgba(0,0,0,0.4); padding:10px; text-align:center; font-weight:800; color:var(--gold); border-bottom:1px solid var(--card-brd); display:flex; justify-content:space-between; align-items:center; font-family:'Lalezar',sans-serif; font-size:17px;}
    .close-chat{ background:none; border:none; color:var(--danger); font-size:20px; cursor:pointer;}
    .chat-messages{ flex-grow:1; padding:10px; display:flex; flex-direction:column; gap:8px; overflow-y:auto;}
    .msg{ padding:8px 12px; border-radius:16px; font-size:14px; max-width:75%; word-wrap:break-word; animation:slideIn .2s ease-out; font-family:'Cairo',sans-serif;}
    @keyframes slideIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
    .msg.me{ background:var(--mint); color:#012; align-self:flex-start; border-bottom-right-radius:2px;}
    .msg.opp{ background:var(--sky); color:#fff; align-self:flex-end; border-bottom-left-radius:2px;}
    .msg.sticker{ background:transparent !important; font-size:45px; padding:0; animation:popSticker .5s cubic-bezier(0.175,0.885,0.32,1.275);}
    .stickers-bar{ display:flex; gap:8px; padding:8px; background:rgba(0,0,0,0.5); overflow-x:auto; border-top:1px solid var(--card-brd);}
    .stk-btn{ background:none; border:none; font-size:24px; cursor:pointer; transition:transform .2s; padding:0;}
    .stk-btn:active{ transform:scale(1.4);}
    .chat-controls{ display:flex; padding:8px; background:rgba(0,0,0,0.6);}
    .chat-input{ flex-grow:1; border:none; border-radius:20px; padding:9px 15px; outline:none; margin-right:8px; background:rgba(255,255,255,0.92); font-family:'Cairo',sans-serif;}
    .chat-send{ background:var(--gold); border:none; border-radius:50%; width:36px; height:36px; font-weight:800; cursor:pointer; font-size:16px;}

    .modal{ position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(5,2,15,0.87); display:flex; justify-content:center; align-items:center; z-index:9999; backdrop-filter:blur(9px); opacity:1; transition:opacity .2s;}
    .modal.hidden{ opacity:0; pointer-events:none;}
    .modal-content{ background:linear-gradient(150deg,#3a1668,#1a1250); padding:26px; border-radius:22px; text-align:center; border:2px solid var(--gold); width:85%; max-width:320px; box-shadow:0 15px 40px rgba(0,0,0,0.7); transform:scale(1); transition:transform .3s cubic-bezier(0.175,0.885,0.32,1.275); max-height:85vh; overflow-y:auto;}
    .modal.hidden .modal-content{ transform:scale(0.8);}
    .modal-title{ margin-top:0; font-size:23px; color:#fff; margin-bottom:15px; font-family:'Lalezar',sans-serif;}
    .modal-body{ font-size:15px; line-height:1.6; margin-bottom:20px; color:#ddd;}
    .modal-input{ width:90%; padding:12px; margin-bottom:15px; border-radius:10px; border:none; font-size:16px; text-align:center; outline:none; font-weight:700; font-family:'Cairo',sans-serif;}
    .modal-btn-group{ display:flex; gap:10px; flex-direction:column;}
    .btn-primary{ background:linear-gradient(135deg,var(--gold),#e6a53f); color:#1a1250; border:none; padding:12px 20px; font-size:16px; font-weight:800; border-radius:10px; cursor:pointer; width:100%; transition:transform .1s; font-family:'Cairo',sans-serif;}
    .btn-primary:active{ transform:scale(0.95);}
    .btn-secondary{ background:#463a5e; color:#fff; border:none; padding:12px 20px; font-size:16px; font-weight:800; border-radius:10px; cursor:pointer; width:100%; transition:transform .1s; font-family:'Cairo',sans-serif;}
    .btn-secondary:active{ transform:scale(0.95);}
    .login-guide{ background:rgba(0,0,0,0.25); border-radius:10px; padding:13px; margin-bottom:15px; text-align:right; font-size:13px; line-height:1.7; color:#ddd; border-right:3px solid var(--mint);}
    .login-guide span{ color:var(--gold); font-weight:800;}
    .wait-spinner{ border:4px solid rgba(255,255,255,0.1); border-top:4px solid var(--gold); border-radius:50%; width:42px; height:42px; animation:spin 1s linear infinite; margin:15px auto;}
    @keyframes spin{ to{ transform:rotate(360deg); } }

    /* تحديات وإنجازات */
    .challenge-item{ background:rgba(255,255,255,0.06); border:1px solid var(--card-brd); border-radius:12px; padding:12px; margin-bottom:10px; text-align:right;}
    .challenge-item.done{ border-color:var(--mint); background:rgba(0,230,168,0.1);}
    .ch-title{ font-weight:800; font-size:14px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;}
    .ch-reward{ color:var(--gold); font-size:13px; font-family:'Lalezar',sans-serif;}
    .ch-bar-bg{ width:100%; background:#2a1d44; border-radius:8px; height:9px; overflow:hidden; margin-top:6px;}
    .ch-bar-fill{ height:100%; background:linear-gradient(90deg,var(--mint),var(--sky)); transition:width .4s;}
    .ch-progress-text{ font-size:11px; color:var(--ink-dim); margin-top:4px;}
    .claim-btn{ background:linear-gradient(135deg,var(--mint),#00a884); color:#012; border:none; padding:6px 14px; border-radius:8px; font-weight:800; cursor:pointer; font-size:12px; margin-top:8px; font-family:'Cairo',sans-serif;}

    .badge-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
    .badge-item{ background:rgba(255,255,255,0.05); border:1px solid var(--card-brd); border-radius:12px; padding:10px 6px; text-align:center; opacity:0.35; filter:grayscale(1);}
    .badge-item.unlocked{ opacity:1; filter:none; border-color:var(--gold); background:rgba(255,201,77,0.1);}
    .badge-icon{ font-size:30px; display:block; margin-bottom:4px;}
    .badge-name{ font-size:10px; font-weight:700; color:var(--ink-dim);}
    .badge-item.unlocked .badge-name{ color:var(--gold);}

    /* صفحة الترحيب قبل بدء اللعب الفردي */
    .intro-panel{
        display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
        width:95vw; max-width:340px; min-height:340px; padding:22px 16px; box-sizing:border-box;
        background:linear-gradient(160deg, rgba(74,20,140,0.5), rgba(26,18,80,0.5));
        border:2px solid var(--gold); border-radius:20px; box-shadow:0 0 40px rgba(255,201,77,0.25), inset 0 0 20px rgba(255,255,255,0.05);
    }
    .intro-logo{ font-size:52px; animation:popSticker .8s cubic-bezier(0.175,0.885,0.32,1.275); margin-bottom:2px; text-shadow:0 0 25px var(--gold);}
    .intro-title{ font-family:'Lalezar',sans-serif; font-size:21px; color:var(--gold); margin:4px 0; text-shadow:0 2px 8px rgba(0,0,0,0.6);}
    .intro-sub{ font-size:12px; color:var(--ink-dim); margin-bottom:14px; line-height:1.5;}
    .intro-menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; width:100%; margin-bottom:16px;}
    .intro-menu-grid .btn-small{ width:100%; padding:9px 4px; font-size:12px;}
    .intro-play-btn{
        background:linear-gradient(135deg,#00e6a8,#00a884); color:#012; border:none; padding:15px 28px; border-radius:14px;
        font-weight:900; font-size:16px; cursor:pointer; font-family:'Cairo',sans-serif; box-shadow:0 6px 20px rgba(0,230,168,0.4);
        transition:transform .15s; animation:pulseWager 2s infinite; width:100%;
    }
    .intro-play-btn:active{ transform:scale(0.93);}
    #musicToggleBtn{ position:fixed; top:8px; left:8px; z-index:99999; background:rgba(0,0,0,0.55); border:1px solid var(--mint); color:#fff; border-radius:50%; width:36px; height:36px; font-size:16px; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,0.5);}

    /* ============ خريطة الرحلة (خريطة صماء بصرية بمسار متعرّج ولا نهاية للمستويات) ============ */
    .level-map-shell{

        crackGain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        crackOsc.connect(crackGain); crackGain.connect(audioCtx.destination);
        crackOsc.start(now); crackOsc.stop(now + 0.13);
    } catch(e) {}
}

/* ============ موسيقى خلفية حماسية (مُولّدة برمجيًا، بدون ملفات خارجية) ============
   بتشتغل بس في شاشة الترحيب/القوائم، وبتتوقف تلقائيًا لحظة بدء اللعب الفعلي (فردي أو معركة). */
let musicOn = true;
let musicScheduler = null;
/* موسيقى هادئة ودافئة بأسلوب "باد" (أوتار ممتدة متداخلة) بدل نغمات الأركيد السريعة —
   تدرّج صعودًا وهبوطًا ناعم لكل وتر، مع باص خفيف تحته، وطبقة ثانية مزوّدة (detuned) لدفء الصوت. */
const musicChords = [
    [261.63, 329.63, 392.00, 523.25], // دو الكبير
    [220.00, 261.63, 329.63, 440.00], // لا الصغير
    [174.61, 220.00, 261.63, 349.23], // فا الكبير
    [196.00, 246.94, 293.66, 392.00], // صول الكبير
];
let musicChordIndex = 0;
const CHORD_DURATION = 3.4;
function playMusicChord(freqs, duration) {
    try {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        freqs.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator();
            const filt = audioCtx.createBiquadFilter(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now);
            osc2.type = 'triangle'; osc2.frequency.setValueAtTime(freq * 1.004, now);
            filt.type = 'lowpass'; filt.frequency.setValueAtTime(1600, now);
            let vol = idx === 0 ? 0.042 : 0.024;
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(vol, now + 0.7);
            gain.gain.setValueAtTime(vol, now + duration - 0.9);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.connect(filt); osc2.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + duration + 0.1);
            osc2.start(now); osc2.stop(now + duration + 0.1);
        });
        const bassOsc = audioCtx.createOscillator(); const bassGain = audioCtx.createGain();
        bassOsc.type = 'sine'; bassOsc.frequency.setValueAtTime(freqs[0] / 2, now);
        bassGain.gain.setValueAtTime(0.0001, now);
        bassGain.gain.exponentialRampToValueAtTime(0.045, now + 0.9);
        bassGain.gain.setValueAtTime(0.045, now + duration - 1.1);
        bassGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        bassOsc.connect(bassGain); bassGain.connect(audioCtx.destination);
        bassOsc.start(now); bassOsc.stop(now + duration + 0.1);
    } catch(e) {}
}
function scheduleMusicStep() {
    if (!musicOn || !audioCtx || audioCtx.state !== 'running') return;
    playMusicChord(musicChords[musicChordIndex % musicChords.length], CHORD_DURATION);
    musicChordIndex++;
}
function startBackgroundMusic() {
    if (musicScheduler || !musicOn) return;
    scheduleMusicStep();
    musicScheduler = setInterval(scheduleMusicStep, (CHORD_DURATION - 0.2) * 1000);
}
function stopBackgroundMusic() { if (musicScheduler) { clearInterval(musicScheduler); musicScheduler = null; } }
window.toggleMusic = function() {
    musicOn = !musicOn;
    const btn = document.getElementById('musicToggleBtn');
    if (musicOn) { startBackgroundMusic(); if (btn) btn.innerHTML = '&#x1F50A;'; }

    else { stopBackgroundMusic(); if (btn) btn.innerHTML = '&#x1F507;'; }
};


function playSound(type) {
    try {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        function createTone(wave, freq, vol, timeStart, duration, freqGlideTo) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = wave; osc.frequency.setValueAtTime(freq, timeStart);
            if(freqGlideTo) osc.frequency.exponentialRampToValueAtTime(freqGlideTo, timeStart + duration);
            gain.gain.setValueAtTime(vol, timeStart); gain.gain.exponentialRampToValueAtTime(0.001, timeStart + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(timeStart); osc.stop(timeStart + duration);
        }
        if (type === 'click') { createTone('sine', 400, 0.1, now, 0.1, 200); }
        else if (type === 'tick') { createTone('sine', 800, 0.05, now, 0.05); }
        else if (type === 'match') { createTone('sine', 523.25, 0.15, now, 0.2); createTone('sine', 659.25, 0.1, now + 0.05, 0.2); }
        else if (type === 'epic_match') { createTone('sine', 523.25, 0.15, now, 0.3); createTone('sine', 659.25, 0.15, now + 0.1, 0.3); createTone('sine', 783.99, 0.15, now + 0.2, 0.4); }
        else if (type === 'error') { createTone('triangle', 200, 0.2, now, 0.2, 100); }
        else if (type === 'win') { createTone('sine', 440, 0.1, now, 0.3); createTone('sine', 554, 0.1, now + 0.15, 0.3); createTone('sine', 659, 0.1, now + 0.3, 0.3); createTone('sine', 880, 0.15, now + 0.45, 0.6); }
        else if (type === 'lose') { createTone('triangle', 349, 0.1, now, 0.4); createTone('triangle', 329, 0.1, now + 0.2, 0.4); createTone('triangle', 293, 0.15, now + 0.4, 0.6); }
        else if (type === 'alert') { createTone('sine', 600, 0.1, now, 0.2, 800); }
        else if (type === 'msg_pop') { createTone('sine', 800, 0.05, now, 0.1, 1000); }
        else if (type === 'coin') { createTone('sine', 1200, 0.05, now, 0.15, 1600); }
        else if (type === 'badge') { createTone('sine', 660, 0.12, now, 0.2); createTone('sine', 880, 0.12, now+0.12, 0.25); createTone('sine', 1100, 0.12, now+0.24, 0.35); }
    } catch(e) {}
}
window.playSound = playSound;

function animateMoneyTransfer(winnerIsMe, amount, callback) {
    const myBoxWrapper = document.getElementById('scoreWrapper');
    const oppBoxWrapper = document.getElementById('targetWrapper');
    const startBox = winnerIsMe ? oppBoxWrapper.getBoundingClientRect() : myBoxWrapper.getBoundingClientRect();
    const endBox = winnerIsMe ? myBoxWrapper.getBoundingClientRect() : oppBoxWrapper.getBoundingClientRect();

    if(winnerIsMe) { myBoxWrapper.classList.add('highlight'); oppBoxWrapper.classList.add('lose-highlight'); }
    else { oppBoxWrapper.classList.add('highlight'); myBoxWrapper.classList.add('lose-highlight'); }

    const numCoins = 15; let completed = 0;
    playSound('win');
    if(winnerIsMe) fireConfetti(50);

    for (let i = 0; i < numCoins; i++) {
        let coin = document.createElement('div');
        coin.innerHTML = '&#11088;';
        coin.style.position = 'fixed'; coin.style.fontSize = '32px'; coin.style.zIndex = '9999'; coin.style.pointerEvents = 'none';
        coin.style.left = (startBox.left + startBox.width/2 - 15) + 'px'; coin.style.top = (startBox.top + startBox.height/2 - 15) + 'px';
        coin.style.transition = `all ${0.6 + Math.random() * 0.4}s cubic-bezier(0.25, 1, 0.5, 1)`;
        let scatterX = (Math.random() - 0.5) * 80; let scatterY = (Math.random() - 0.5) * 80;
        coin.style.transform = `translate(${scatterX}px, ${scatterY}px) scale(0.5) rotate(${Math.random()*360}deg)`;
        coin.style.opacity = '0';
        document.body.appendChild(coin);
        setTimeout(() => {
            coin.style.opacity = '1'; playSound('coin');
            coin.style.transform = `translate(${endBox.left - startBox.left}px, ${endBox.top - startBox.top}px) scale(1.2) rotate(${Math.random()*360}deg)`;
        }, 50 + i * 40);
        setTimeout(() => {
            coin.style.opacity = '0'; coin.style.transform += ' scale(0)';
            setTimeout(() => {
                if(coin.parentNode) coin.parentNode.removeChild(coin);
                completed++;
                if (completed === numCoins) {
                    myBoxWrapper.classList.remove('highlight', 'lose-highlight');
                    oppBoxWrapper.classList.remove('highlight', 'lose-highlight');
                    if(callback) callback();
                }
            }, 300);
        }, 800 + i * 40);
    }
}

const LEVELS_PER_LAND = 10;
function landForLevel(lvl) {
    let landIndex = Math.floor((lvl - 1) / LEVELS_PER_LAND);
    let cycle = Math.floor(landIndex / MAP_LANDS.length);
    let base = MAP_LANDS[landIndex % MAP_LANDS.length];
    let name = base.name + (cycle > 0 ? ` (الجولة ${cycle + 1})` : '');
    return { name, landIndex, bg: base.bg, texture: base.texture, textureSize: base.textureSize };
}


window.closeLevelMap = function() {
    document.getElementById('levelMapOverlay').classList.add('hidden');
};

window.openLevelMap = function(celebratory) {
    playSound('click');
    let curLevel = window.userData.level || 1;
    let stars = window.userData.levelStars || {};
    let startLvl = Math.max(1, curLevel - 8);
    let endLvl = curLevel + 45;

    let html = '<div class="lm-spine"></div>';
    let currentLandIndex = -1;
    let currentNodeId = null;
    let sectionOpen = false;

    for (let lvl = startLvl; lvl <= endLvl; lvl++) {
        let land = landForLevel(lvl);
        if (land.landIndex !== currentLandIndex) {
            if (sectionOpen) html += '</div>';
            currentLandIndex = land.landIndex;
            let sizeRule = land.textureSize === 'auto' ? '' : `background-size:${land.textureSize};`;
            html += `<div class="lm-land-section" style="background:${land.texture} , ${land.bg}; ${sizeRule}">`;
            html += `<div class="lm-land-divider">${land.name}<br><span style="font-size:11px; opacity:0.7;">المستويات ${land.landIndex*LEVELS_PER_LAND+1} - ${(land.landIndex+1)*LEVELS_PER_LAND}</span></div>`;
            sectionOpen = true;
        }
        let isDone = lvl < curLevel;
        let isCurrent = lvl === curLevel;
        let isLocked = lvl > curLevel;
        let lvlStars = stars[lvl] || 0;
        let offset = 50 + 32 * Math.sin(lvl * 0.9);
        let connLeft = offset < 50 ? offset : 50;
        let connWidth = Math.abs(offset - 50);
        let stateClass = isCurrent ? 'current' : isDone ? 'done' : 'locked';
        let nodeId = `lmNode${lvl}`;
        if (isCurrent) currentNodeId = nodeId;
        html += `<div class="lm-node-row">
            <div class="lm-connector" style="left:${connLeft}%; width:${connWidth}%; top:38px;"></div>
            <div class="lm-node-wrap" style="left:calc(${offset}% - 35px);">
                <div class="lm-node ${stateClass}" id="${nodeId}" onclick="window.selectMapLevel(${lvl})">
                    ${isLocked ? '<span class="lm-lock-icon">&#x1F512;</span>' : lvl}
                </div>
                <div class="lm-node-stars">${(isDone || isCurrent) ? renderStars(lvlStars) : ''}</div>
            </div>
        </div>`;
    }
    if (sectionOpen) html += '</div>';
    html += `<div class="lm-teaser">&#x1F30D; ولسه فيه بلاد ومستويات أكتر تنتظرك مع كل تقدم...</div>`;

    document.getElementById('levelMapContent').innerHTML = html;
    document.getElementById('lmLandBanner').innerHTML = landForLevel(curLevel).name;
    document.getElementById('levelMapOverlay').classList.remove('hidden');

    if (celebratory) {
        playSound('win'); fireConfetti(50);
        let shell = document.querySelector('.level-map-shell');
        let banner = document.createElement('div');
        banner.className = 'lm-celebrate-banner';
        banner.innerHTML = '&#x1F389; مستوى جديد اتفتح! &#x1F389;';
        shell.appendChild(banner);
        setTimeout(() => { if (banner.parentNode) banner.parentNode.removeChild(banner); }, 2900);
    }

    setTimeout(() => {
        let node = document.getElementById(currentNodeId);
        if (node) node.scrollIntoView({ block: 'center' });
    }, 60);
};

async function processLogin(user, pass) {
    let myFlag = await fetchUserFlag();
    get(ref(db, `users/${user}`)).then(async (snap) => {
        if (snap.exists()) {
            let data = snap.val();
            if (data.banned) {
                localStorage.removeItem('candyUser'); localStorage.removeItem('candyPass');
                return AppModal.alert("تم حظر هذا الحساب نهائياً من قبل الإدارة! &#x1F6AB;");
            }

            // توافق مع الحسابات القديمة المخزنة بنص صريح: نقوم بترقيتها تلقائياً لتشفير آمن
            let passOk = false;
            if (data.passwordHash && data.salt) {
                let attemptHash = await hashPassword(pass, data.salt);
                passOk = (attemptHash === data.passwordHash);
            } else if (data.password) {
                passOk = (data.password === pass);
                if (passOk) {
                    let newSalt = generateSalt();
                    let newHash = await hashPassword(pass, newSalt);
                    data.passwordHash = newHash; data.salt = newSalt;
                    update(ref(db, `users/${user}`), { passwordHash: newHash, salt: newSalt, password: null }).catch(e=>console.log(e));
                }
            }

            if (passOk) {
                localStorage.setItem('candyUser', user); localStorage.setItem('candyPass', pass);
                if(data.balance === undefined) data.balance = data.totalScore || 100;
                if(data.battlesPlayed === undefined) data.battlesPlayed = 0;
                if(data.lastSupportTime === undefined) data.lastSupportTime = 0;
                if(data.soloGamesPlayed === undefined) data.soloGamesPlayed = 0;
                if(data.lastSpinTime === undefined) data.lastSpinTime = 0;
                if(data.lastGiftTime === undefined) data.lastGiftTime = 0;
                if(data.achievements === undefined) data.achievements = {};
                if(data.totalWins === undefined) data.totalWins = 0;
                if(data.bestCombo === undefined) data.bestCombo = 0;
                if(data.giftsSent === undefined) data.giftsSent = 0;
                if(data.bestSoloScore === undefined) data.bestSoloScore = 0;
                if(data.levelStars === undefined) data.levelStars = {};
                if(data.loginStreak === undefined) data.loginStreak = 0;
                if(data.lastLoginDate === undefined) data.lastLoginDate = null;
                data.flag = getSafeFlag(data.flag || myFlag);
                update(ref(db, `users/${user}`), { flag: data.flag, isSearching: false, online: true }).catch(e=>console.log(e));
                window.currentUser = user; window.userData = data; AppModal.close(); startGame();
            } else {
                localStorage.removeItem('candyUser'); localStorage.removeItem('candyPass');
                AppModal.alert("كلمة المرور خاطئة يا صديقي!");
                displayLoginModal();
            }
        } else {
            localStorage.setItem('candyUser', user); localStorage.setItem('candyPass', pass);
            let salt = generateSalt();
            let passwordHash = await hashPassword(pass, salt);
            let newData = { passwordHash, salt, level: 1, balance: 100, battlesPlayed: 0, soloGamesPlayed: 0, online: true, banned: false, flag: myFlag, isSearching: false, lastSupportTime: 0, lastSpinTime: 0, lastGiftTime: 0, achievements: {}, totalWins: 0, bestCombo: 0, giftsSent: 0, bestSoloScore: 0, levelStars: {}, loginStreak: 0, lastLoginDate: null };
            set(ref(db, `users/${user}`), newData); window.currentUser = user; window.userData = newData; AppModal.close(); startGame();
        }
    }).catch(() => { displayLoginModal(); });
}

    update(ref(db, `users/${window.currentUser}`), { isSearching: true, searchWager: wager });
    let pool = window.botsData.map(b => ({name: b.name, flag: b.flag}));
    Object.keys(window.usersList).forEach(p => { if(p !== window.currentUser) pool.push({name: p, flag: getSafeFlag(window.usersList[p].flag)}); });

    AppModal.show({
        title: "جاري البحث...",
        html: `<p style="font-size:13px; color:#ddd;">نبحث عن لاعبين حقيقيين أولاً...</p>
               <div id="rouletteBox" style="font-size: 24px; font-weight: bold; margin: 20px 0; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 12px; border: 2px solid #3fb8ff; color: #fff;">
                <span id="rFlag">&#x1F30D;</span> <span id="rName">نبحث...</span>
               </div>`,
        showCancel: true, cancelText: "إلغاء البحث", autoClose: false,
        onCancel: () => {
            window.userData.isSearching = false;
            update(ref(db, `users/${window.currentUser}`), { isSearching: false, searchWager: null });
            if(window.rouletteInterval) clearInterval(window.rouletteInterval);
            if(window.rouletteTimeout) clearTimeout(window.rouletteTimeout);
        }
    });

    let rFlag = document.getElementById('rFlag'); let rName = document.getElementById('rName'); let rBox = document.getElementById('rouletteBox');
    window.rouletteInterval = setInterval(() => {
        let randUser = pool[Math.floor(Math.random() * pool.length)];
        if(rFlag && rName) { rFlag.innerHTML = getSafeFlag(randUser.flag); rName.innerText = randUser.name; playSound('tick'); }
    }, 100);

    window.rouletteTimeout = setTimeout(() => {
        if(!window.userData.isSearching) return;
        clearInterval(window.rouletteInterval);
        let availableRealPlayers = Object.keys(window.usersList).filter(p => {
            let pd = window.usersList[p];
            return p !== window.currentUser && !pd.isBot && pd.online && pd.isSearching && pd.searchWager === wager && pd.balance >= wager;
        });
        let finalTarget; let isBotTarget = false;
        let validBots = window.botsData.filter(b => { let bBal = window.usersList[b.name] ? (window.usersList[b.name].balance || 0) : 0; return bBal >= wager; });

        if (availableRealPlayers.length > 0) {
            let targetPlayerName = availableRealPlayers[Math.floor(Math.random() * availableRealPlayers.length)];
            finalTarget = { name: targetPlayerName, flag: getSafeFlag(window.usersList[targetPlayerName].flag) };
        } else if (validBots.length > 0) { finalTarget = validBots[Math.floor(Math.random() * validBots.length)]; isBotTarget = true; }
        else { finalTarget = window.botsData[Math.floor(Math.random() * window.botsData.length)]; isBotTarget = true; update(ref(db, `users/${finalTarget.name}`), { balance: wager + 200 }); }

        if(rFlag && rName && rBox) {
            rFlag.innerHTML = getSafeFlag(finalTarget.flag); rName.innerText = finalTarget.name;
            rBox.style.background = 'rgba(0, 230, 168, 0.25)'; rBox.style.borderColor = '#00e6a8';
            rBox.style.transform = 'scale(1.05)'; rBox.style.transition = 'all 0.3s ease';
        }
        playSound('epic_match');
        setTimeout(() => {
            AppModal.close();
            AppModal.show({
                title: "تأكيد اللعب &#x2694;",
                html: `المنافس: <strong>${getSafeFlag(finalTarget.flag)} ${finalTarget.name}</strong><br>الرهان: <strong style="color:#8affd6">${STAR}${wager}</strong>`,
                showCancel: true, cancelText: "إلغاء &#x274C;", confirmText: "بدء &#x1F680;", confirmColor: '#00e6a8',
                onConfirm: () => { if(isBotTarget) challengeSelectedBot(finalTarget.name, wager, finalTarget.flag, true); else executeChallengeRequest(finalTarget.name, wager); },
                onCancel: () => { window.userData.isSearching = false; update(ref(db, `users/${window.currentUser}`), { isSearching: false, searchWager: null }); }
            });
        }, 1000);
    }, 3000);
}

function challengeSelectedBot(botName, wager, botFlag, fromRandom = false) {
    botFlag = getSafeFlag(botFlag);
    let isABot = false;
    window.botsData.forEach(b => { if(b.name === botName) isABot = true; });
    if (isABot) {
        playSound('click');
        if(!fromRandom) AppModal.showWait("جاري إرسال التحدي...", `في انتظار رد ${botName}`);
        setTimeout(() => {
            let rejectChance = fromRandom ? 0 : 0.15;
            if (Math.random() < rejectChance) {
                AppModal.close(); playSound('error');
                AppModal.show({
                    title: "مرفوض &#x1F6A8;", html: `لقد رفض <strong>${botName}</strong> طلب التحدي. يبدو أنه مشغول بمباراة أخرى الآن!`,
                    confirmText: "حسناً &#x2705;",
                    onConfirm: () => { window.userData.isSearching = false; update(ref(db, `users/${window.currentUser}`), { isSearching: false, searchWager: null }); }
                });
            } else {
                AppModal.close(); playSound('alert');
                window.battleRole = 'challenger'; window.currentBattleWager = wager; window.opponentName = botName;
                startBotBattle(wager, botName, botFlag);
            }
        }, fromRandom ? 500 : 1500 + Math.random() * 1500);
        return;
    }
    executeChallengeRequest(botName, wager);
}
window.challengeSelectedBot = challengeSelectedBot;

function checkDailyStreak() {
    let today = dayKey(new Date());
    let lastLogin = window.userData.lastLoginDate;
    if (lastLogin === today) return; // اتفحصت النهاردة قبل كده
    let yesterday = dayKey(new Date(Date.now() - 24*60*60*1000));
    let streak = (lastLogin === yesterday) ? ((window.userData.loginStreak || 0) + 1) : 1;
    window.userData.lastLoginDate = today;
    window.userData.loginStreak = streak;
    let reward = Math.min(streak, 7) * 10;
    window.userData.balance += reward;
    update(ref(db, `users/${window.currentUser}`), { lastLoginDate: today, loginStreak: streak, balance: window.userData.balance }).catch(e=>console.log(e));
    checkAchievements();
    setTimeout(() => {
        playSound('epic_match'); fireConfetti(30);
        if (!window.battleMode) scoreDisplay.innerHTML = fmtStars(window.userData.balance);
        AppModal.show({
            title: "مكافأة الدخول اليومي! &#x1F4C5;",
            html: `<div style="font-size:60px; margin:10px 0;">&#x1F525;</div>
                   <h3 style="color:#8affd6; margin:5px 0;">سلسلة ${streak} ${streak===1?'يوم':'أيام'} متتالية!</h3>
                   <p>ربحت <strong style="color:#ffc94d">+${STAR}${reward}</strong></p>
                   <p style="font-size:12px; color:#999;">استمر كل يوم عشان تكبر المكافأة (لحد ⭐70 في اليوم السابع فأكثر)</p>`,
            confirmText: "رائع! &#x1F970;"
        });
    }, 900);
}

function startGame() {
    document.getElementById('playerName').innerText = window.currentUser;
    document.getElementById('playerFlag').innerHTML = getSafeFlag(window.userData.flag);
    remove(ref(db, `users/${window.currentUser}/battle`));
    ensureDailyChallenges();
    checkDailyStreak();

    onValue(ref(db, '.info/connected'), (snap) => {
        window.amIConnected = snap.val() === true;
        if (window.amIConnected) {
            window.lastOpponentPingTime = Date.now();
            if(window.currentUser) {
                const myOnlineRef = ref(db, `users/${window.currentUser}/online`);
                onDisconnect(myOnlineRef).set(false).then(() => { set(myOnlineRef, true); });
                onDisconnect(ref(db, `users/${window.currentUser}/isSearching`)).set(false);
            }
        }
    });

    onValue(ref(db, `users/${window.currentUser}/banned`), (snap) => {
        if(snap.exists() && snap.val() === true) {
            localStorage.removeItem('candyUser'); localStorage.removeItem('candyPass');
            AppModal.show({ title: "تم حظرك! &#x1F6AB;", html: "لقد تم حظرك من قبل الإدارة لمخالفة القوانين.", confirmText: "خروج", autoClose: false, onConfirm: () => { location.reload(); } });
            set(ref(db, `users/${window.currentUser}/online`), false);
        }
    });

    level = window.userData.level || 1;
    listenToDatabase(); playSound('win');
    scoreDisplay.innerHTML = fmtStars(window.userData.balance); targetDisplay.innerHTML = level;

    get(ref(db, `users/${window.currentUser}/pendingGift`)).then((snap) => {
        if(snap.exists()) {
            let gifts = snap.val(); let totalGifts = 0; let senders = [];
            Object.values(gifts).forEach(g => { totalGifts += g.amount; senders.push(g.from); });
            playSound('epic_match'); fireConfetti(30);
            AppModal.show({
                title: "مفاجأة! هدايا لك أثناء غيابك &#x1F381;",
                html: `المرسلون: <strong style="color:#9b59b6;">${[...new Set(senders)].join(' و ')}</strong><br>المبلغ الإجمالي: <strong style="color:#8affd6; font-size:24px;">${STAR}${totalGifts}</strong>!`,
                confirmText: "رائع! استلام &#x1F911;", confirmColor: '#9b59b6',
                onConfirm: () => { remove(ref(db, `users/${window.currentUser}/pendingGift`)); }
            });
        }
    });

    if(!window.botChallengeSent) {
        setTimeout(() => {
            if(!window.battleMode && !window.userData.isSearching) {
                window.botChallengeSent = true;
                let onlineBots = window.botsData.filter((b, idx) => ((idx + new Date().getHours()) % 2 === 0));
                let randomBot = onlineBots[Math.floor(Math.random() * onlineBots.length)] || window.botsData[0];
                let botBal = window.usersList[randomBot.name] ? (window.usersList[randomBot.name].balance || 500) : 500;
                let playerBal = window.userData.balance || 0;
                let maxWager = Math.min(botBal, playerBal, 2000);
                let wagerOptions = [10, 50, 100, 200, 500, 750, 1000, 1500, 2000];
                let validWagers = wagerOptions.filter(w => w <= maxWager);
                let wager = validWagers.length > 0 ? validWagers[Math.floor(Math.random() * validWagers.length)] : 10;
                playSound('alert');
                AppModal.show({
                    title: "تحدي جديد! &#x2694;",
                    html: `<strong style="color:#ff6fa3">${getSafeFlag(randomBot.flag)} ${randomBot.name}</strong> يتحداك على <strong style="color:#8affd6">${STAR}${wager}</strong>!`,
                    showCancel: true, confirmText: "قبول &#x2705;", cancelText: "رفض &#x274C;",
                    onConfirm: () => {
                        if(window.userData.balance < wager) return AppModal.alert("رصيدك لا يكفي لقبول التحدي!");
                        AppModal.close(); playSound('alert');
                        window.battleRole = 'challenged'; window.currentBattleWager = wager; window.opponentName = randomBot.name;
                        startBotBattle(wager, randomBot.name, getSafeFlag(randomBot.flag));
                    },
                    onCancel: () => { AppModal.close(); }
                });
            }
        }, 25000);
    }
}

window.updatePlayersDOM = function() {
    if(!window.usersList) return;
    let currentHour = new Date().getHours();
    let timeVar = Math.floor(Date.now() / 15000);
    window.botsData.forEach((b, index) => {
        let isOnline = ((index + currentHour) % 2 === 0);
        let dynamicBalance = 550 + (((b.name.length * 23) + (index * 41) + (timeVar * 13)) % 3500);
        if(!window.usersList[b.name]) { window.usersList[b.name] = { balance: dynamicBalance, online: isOnline, flag: b.flag, isBot: true, banned: false, level: b.level }; }
        else { window.usersList[b.name].online = isOnline; window.usersList[b.name].isBot = true; window.usersList[b.name].flag = b.flag; window.usersList[b.name].balance = dynamicBalance; }
    });

    let html = '';
    let sorted = Object.keys(window.usersList).sort((a,b) => (window.usersList[b].balance || 0) - (window.usersList[a].balance || 0));
    let myData = window.usersList[window.currentUser] || {};
    let myBlockedList = myData.blocked || {};

    sorted.forEach((p, rankIndex) => {
        let pData = window.usersList[p]; let isMe = (p === window.currentUser);
        let pBalance = pData.balance || pData.totalScore || 0; let isOnline = pData.online === true;
        let isBannedGlobally = pData.banned === true;
        let pFlag = getSafeFlag(pData.flag);
        let rankCrown = '';
        if(!isBannedGlobally) {
            if (rankIndex === 0) rankCrown = '&#x1F947; '; else if (rankIndex === 1) rankCrown = '&#x1F948; '; else if (rankIndex === 2) rankCrown = '&#x1F949; ';
        }
        let pLevel = pData.level || 1;
        let pTitle = pLevel > 50 ? '&#x1F409; أسطورة' : pLevel > 20 ? '&#x1F479; زعيم' : pLevel > 10 ? '&#x1F977; محترف' : '&#x1F476; مبتدئ';
        let theirBlockedList = pData.blocked || {};
        let iBlockedThem = myBlockedList[p] === true;
        let theyBlockedMe = theirBlockedList[window.currentUser] === true;

        if(isMe) {
            window.userData.balance = pBalance; window.userData.blocked = myBlockedList;
            window.userData.lastSupportTime = pData.lastSupportTime || 0; window.userData.soloGamesPlayed = pData.soloGamesPlayed || 0;
            if(!window.battleMode) { scoreDisplay.innerHTML = fmtStars(pBalance); scoreDisplay.className = "value money-color"; }
            checkSupportEligibility();
        }

        let dotClass = isOnline ? 'online' : 'offline';
        let actionBtns = '';
        if (isMe) { actionBtns = `<span style="color:#8affd6; font-size:12px;">أنت</span>`; }
        else if (isBannedGlobally) { actionBtns = `<span class="banned-text">ممنوع من اللعب</span>`; }
        else if (iBlockedThem) { actionBtns = `<div class="admin-controls"><button class="ban-btn" onclick="window.togglePersonalBan('${p}', true)" style="background:#2ecc71; color:#000;">فك الحظر الشخصي &#x2705;</button></div>`; }
        else if (theyBlockedMe && !pData.isBot) { actionBtns = `<span style="color:#777; font-size:12px;">غير متاح للتفاعل</span>`; }
        else {
            let btnChallenge = `<button class="challenge-btn" onclick="window.openWagerModal('${p}')">تحدي &#x2694;</button>`;
            let btnGift = `<button class="gift-btn" onclick="window.openGiftModal('${p}')">إهداء &#x1F381;</button>`;
            let btnPersonalBlock = `<button class="ban-btn" onclick="window.togglePersonalBan('${p}', false)">حظر شخصي &#x1F6AB;</button>`;
            actionBtns = `<div class="btn-group">${btnGift}${btnChallenge}</div><div class="admin-controls">${btnPersonalBlock}</div>`;
        }

        let adminBtns = '';
        if (window.currentUser === 'اسلام' && !isMe && !pData.isBot) {
            let globalBanText = isBannedGlobally ? "فك الحظر العام &#x2705;" : "حظر عام &#x1F6A8;";
            adminBtns = `<div class="admin-controls" style="background:rgba(231, 76, 60, 0.2); padding:5px; border-radius:5px; margin-top:5px;">
                <button class="ban-btn" style="background:#e67e22;" onclick="window.toggleGlobalBan('${p}', ${isBannedGlobally})">${globalBanText}</button>
                <button class="del-btn" onclick="window.deletePlayer('${p}')">حذف نهائي &#x1F5D1;</button>
            </div>`;
        }

        let pStatus = isBannedGlobally ? `<span class="banned-text">(حساب مغلق)</span>` : (iBlockedThem ? `<span style="color:#7f8c8d">(محظور من قبلك)</span>` : `الرصيد: ${STAR}${pBalance}`);

        html += `<div class="player-row">
                    <div class="p-name"><span class="p-name-text">${rankCrown}${pFlag} ${p}</span><span class="status-dot ${dotClass}"></span></div>
                    <div><span class="p-title">${pTitle}</span></div>
                    <div class="p-score">${pStatus}</div>
                    ${actionBtns}
                    ${adminBtns}
                 </div>`;
    });

    let pList = document.getElementById('playersList');
    if(pList) { pList.innerHTML = html; filterPlayers(); }
};

function filterPlayers() {
    let filter = document.getElementById('searchPlayerInput').value.toLowerCase();
    let rows = document.getElementById('playersList').getElementsByClassName('player-row');
    for (let i = 0; i < rows.length; i++) {
        let nameElement = rows[i].getElementsByClassName('p-name-text')[0];

        if (nameElement && statusElement) {
            let txtValue = nameElement.textContent || nameElement.innerText;

function handleForfeit(battle) {
    try {
        if(!window.battleMode) return;
        window.battleMode = false; window.isWaitingForOpponent = false; AppModal.close();
        if(window.battlePingInterval) clearInterval(window.battlePingInterval);
        if(window.battleMonitorInterval) clearInterval(window.battleMonitorInterval);
        if(window.disconnectRef) window.disconnectRef.cancel();

        if(battle.disconnectedUser === window.opponentName) {
            updateMyBalance(battle.wager);
            window.userData.totalWins = (window.userData.totalWins||0)+1;
            update(ref(db, `users/${window.currentUser}`), { totalWins: window.userData.totalWins });
            progressChallenge('winbattle', 1, true); checkAchievements();
            animateMoneyTransfer(true, battle.wager, () => {
                AppModal.show({ title: "هروب الخصم! &#x1F3C3;", html: `لقد انقطع الاتصال بالخصم أثناء المعركة!<br>تم إعلان فوزك، وربحت <strong style="color:#8affd6">+${STAR}${battle.wager}</strong>!`, confirmText: "عظيم!", onConfirm: resetToNormalMode });
            });
            get(ref(db, `users/${window.opponentName}`)).then(snap => {
                if(snap.exists()) { let oppBal = snap.val().balance || 0; update(ref(db, `users/${window.opponentName}`), { balance: Math.max(0, oppBal - battle.wager) }).catch(e=>console.log(e)); }
            });

        return AppModal.alert(`عذراً! يمكنك إرسال هدية واحدة فقط كل 24 ساعة. يرجى المحاولة بعد ${hours} ساعة و ${minutes} دقيقة.`);

            playSound('epic_match');
            let cashback = Math.floor(amount * 0.10);
            window.userData.balance = window.userData.balance - amount + cashback;
            window.userData.lastGiftTime = now;
            window.userData.giftsSent = (window.userData.giftsSent||0) + 1;
            update(ref(db, `users/${window.currentUser}`), { balance: window.userData.balance, lastGiftTime: now, giftsSent: window.userData.giftsSent });
            if (window.usersList[targetPlayer]) {
                let isTargetOnline = window.usersList[targetPlayer].online === true;

                update(ref(db, `users/${targetPlayer}`), { balance: targetBalance + amount });

function executeChallengeRequest(targetName, wager) {
    window.opponentName = targetName; window.battleRole = 'challenger'; window.currentBattleWager = wager;
    const targetBattleRef = ref(db, `users/${targetName}/battle`);
    get(targetBattleRef).then(snap => {
        if(snap.exists() && (snap.val().status === 'pending' || snap.val().status === 'accepted')) { return AppModal.alert("الخصم مشغول بتحدي آخر!"); }
        set(targetBattleRef, { challenger: window.currentUser, challenged: targetName, wager: wager, status: 'pending', p1Score: 0, p2Score: 0, p1Done: false, p2Done: false });
        if(window.unsubTargetBattle) window.unsubTargetBattle();
        window.unsubTargetBattle = onValue(targetBattleRef, (snapTarget) => {
            if(!snapTarget.exists()) {
                if(window.battleMode && !window.isBotMatch) { window.battleMode = false; AppModal.show({title: "انتهت المعركة", html: "تم إنهاء المعركة بنجاح.", confirmText: "حسناً", onConfirm: resetToNormalMode}); }
                return;
            }
            let battle = snapTarget.val();
            if(battle.status === 'accepted' && !window.battleMode) { AppModal.close(); playSound('alert'); startBattleMode(battle.wager, battle.challenged); }
            if(battle.status === 'declined') {
                AppModal.show({title: "مرفوض", html: "لقد رفض الخصم طلب التحدي."}); playSound('error');
                resetToNormalMode(); window.unsubTargetBattle(); setTimeout(() => { remove(targetBattleRef); }, 1000);
            }
            if(window.battleMode && battle.status === 'accepted' && window.battleRole === 'challenger') {
                targetDisplay.innerText = Math.max(0, battle.p2Score);
                let myScore = battle.p1Score || 0; let oppScore = battle.p2Score || 0;
                if(battle.p1Done && !battle.p2Done && !window.isWaitingForOpponent) { window.isWaitingForOpponent = true; window.showDynamicWaitModal(myScore, oppScore, targetName); }
                else if (window.isWaitingForOpponent && battle.p1Done && !battle.p2Done) { window.updateWaitingScreen(myScore, oppScore, targetName); }
                else if(battle.p1Done && battle.p2Done) { window.isWaitingForOpponent = false; evaluateBattleResult(battle); }
            }
            if(battle.status === 'forfeited' && window.battleMode && window.battleRole === 'challenger') { handleForfeit(battle); }
            if(window.battleMode && battle.lastMessage && battle.lastMessage.id !== window.lastMsgId) {
                window.lastMsgId = battle.lastMessage.id; renderChat(battle.lastMessage);
                if(battle.lastMessage.sender !== window.currentUser) { playSound('msg_pop'); if(document.getElementById('chatPanel').style.display !== 'flex') showChatPreview(battle.lastMessage); }
            }
        });
        AppModal.showWait("جاري إرسال التحدي...", `في انتظار رد ${targetName}`);
    });
}

/* ============ منطق البوت: عادل بالكامل الآن، بدون تحيز مفروض ============
   البوت يلعب بمستوى مهارة قريب من مستوى اللاعب، والنتيجة تُحسم فعلياً
   بالأداء العشوائي الطبيعي لكل طرف، دون أي تلاعب لصالح "البيت". */
function startBotBattle(wager, botName, botFlag) {
    document.getElementById('introPanel').style.display = 'none';
    document.getElementById('grid').style.display = 'grid';
    stopBackgroundMusic();
    window.userData.isSearching = false; update(ref(db, `users/${window.currentUser}`), { isSearching: false, searchWager: null });
    window.battleEnded = false; window.battleMode = true; window.isBotMatch = true; window.lastMsgId = 0; window.isWaitingForOpponent = false;
    window.botDone = false; window.playerDone = false; window.botScore = 0; window.botMoves = 25;

    document.getElementById('chatMessages').innerHTML = ''; document.getElementById('chatPreviewBubble').classList.add('hidden'); document.getElementById('chatBadge').style.display = 'none';
    moves = 25; currentLevelScore = 0; window.currentBattleWager = wager; window.opponentName = botName;

    document.getElementById('wagerBox').style.display = 'block'; document.getElementById('wagerDisplay').innerText = fmtStars(wager);
    scoreLabel.innerText = "نقاطك"; scoreDisplay.innerHTML = "0"; scoreDisplay.className = "value";
    targetLabel.innerHTML = `${getSafeFlag(botFlag)} ${botName}`; targetDisplay.innerText = "0"; targetDisplay.classList.add('vs-mode'); movesDisplay.innerHTML = moves;

    document.getElementById('menuBtn').style.display = 'none'; document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('spinBtn').style.display = 'none'; document.getElementById('challengesBtn').style.display = 'none'; document.getElementById('achBtn').style.display = 'none'; document.getElementById('mapBtn').style.display = 'none'; document.getElementById('leaderboardBtn').style.display = 'none'; document.getElementById('gameMenuBtn').style.display = 'none';
    document.getElementById('surrenderBtn').style.display = 'block'; document.getElementById('chatBtn').style.display = 'block';

    window.hasUsedSkill = false;
    let ultBtn = document.getElementById('ultimateBtn'); if(ultBtn) ultBtn.disabled = false;
    document.getElementById('skillBar').style.display = 'flex';
    updateObjectiveBanner();
    checkSupportEligibility();

    if(window.botInterval) clearTimeout(window.botInterval);

    // مهارة البوت مرتبطة بمستواه مقارنة بمستوى اللاعب - بدون تحيز فوز إجباري
    let botLevel = 1;
    let botObj = window.botsData.find(b => b.name === botName);
    if(botObj) botLevel = botObj.level;
    let playerLevel = window.userData.level || 1;
    let skillRatio = Math.max(0.6, Math.min(1.4, botLevel / Math.max(playerLevel, 1)));

    function botPlayNextMove() {
        if(!window.battleMode || !window.isBotMatch) return;
        if (window.botMoves > 0) {
            window.botMoves--;
            // كل حركة تمنح نقاطاً عشوائية طبيعية (نفس نطاق نقاط اللاعب تقريباً) معدّلة بمهارة البوت فقط
            let basePoints = 10 + Math.floor(Math.random() * 35); // يحاكي مطابقات 3-5 قطع
            let pointsToAdd = Math.max(5, Math.round(basePoints * skillRatio));
            window.botScore += pointsToAdd;
            targetDisplay.innerText = window.botScore;

            if (window.playerDone) window.updateWaitingScreen(currentLevelScore, window.botScore, botName);

            if (window.botMoves === 12) {
                const midStickers = ['&#x1F608;', '&#x1F525;', '&#x1F4A5;', '&#x1F60E;', '&#x1F480;'];
                let s = midStickers[Math.floor(Math.random() * midStickers.length)];
                renderChat({sender: botName, text: s, isSticker: true}); playSound('msg_pop'); showChatPreview({sender: botName, text: s, isSticker: true});
            }

            if (window.botMoves <= 0) {
                window.botDone = true;
                if (window.playerDone) { AppModal.close(); setTimeout(() => evaluateBotBattleResult(), 500); }
            } else {
                let nextMoveTime = 900 + Math.random() * 1400;
                window.botInterval = setTimeout(botPlayNextMove, nextMoveTime);
            }
        }
    }
    window.botInterval = setTimeout(botPlayNextMove, 1500);
    createBoard();
}
window.startBotBattle = startBotBattle;

function endBattleMode() {

function initLevel() { window.battleEnded = false; moves = 25; currentLevelScore = 0; movesDisplay.innerHTML = moves; if(!window.battleMode) { targetDisplay.innerHTML = level; scoreDisplay.innerHTML = fmtStars(window.userData.balance); updateObjectiveBanner(); } createBoard(); }

let dragStartX = 0, dragStartY = 0, dragStartIndex = null;

function handleInputStart(e) {
    if (moves <= 0 || isAnimating) return;
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err) {}
    dragStartIndex = parseInt(e.currentTarget.id);
    dragStartX = e.clientX; dragStartY = e.clientY;
}

/* الشبكة الآن دايمًا LTR (بعد إزالة dir="rtl" من الصفحة)، فحساب الجار المجاور
   برقم الفهرس مباشرة بقى مضمون ومطابق للشكل المرئي — أبسط وأكثر ثباتًا من الحساب الهندسي. */
function handleInputEnd(e) {
    if (moves <= 0 || isAnimating || dragStartIndex === null) { dragStartIndex = null; return; }
    e.preventDefault();
    let endX = e.clientX, endY = e.clientY;
    let diffX = endX - dragStartX; let diffY = endY - dragStartY;
    if (Math.abs(diffX) > 12 || Math.abs(diffY) > 12) {
        let targetIndex = dragStartIndex;
        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 0 && dragStartIndex % width !== width - 1) targetIndex += 1;
            else if (diffX < 0 && dragStartIndex % width !== 0) targetIndex -= 1;
        } else {
            if (diffY > 0 && dragStartIndex < width * (width - 1)) targetIndex += width;
            else if (diffY < 0 && dragStartIndex >= width) targetIndex -= width;
        }
        if (targetIndex !== dragStartIndex) attemptSwap(dragStartIndex, targetIndex);
    } else {
        if (selectedSquare === null) { selectedSquare = dragStartIndex; squares[dragStartIndex].classList.add('selected'); playSound('click'); }
        else {
            let i1 = selectedSquare; let i2 = dragStartIndex; squares[i1].classList.remove('selected'); selectedSquare = null;
            if (i1 !== i2) attemptSwap(i1, i2);
        }
    }
    dragStartIndex = null;
}

function attemptSwap(i1, i2) {
    if (Math.abs((i1%width)-(i2%width)) + Math.abs(Math.floor(i1/width)-Math.floor(i2/width)) === 1) {
        swap(i1, i2); isAnimating = true; playSound('click'); cascadeMatchCount = 0;
        if(selectedSquare !== null) { squares[selectedSquare].classList.remove('selected'); selectedSquare = null; }
        setTimeout(() => {
            if (!checkMatches()) {
                playSound('error'); swap(i1, i2); isAnimating = false;
                [i1, i2].forEach(idx => {
                    squares[idx].classList.add('invalid-move');
                    setTimeout(() => { if(squares[idx]) squares[idx].classList.remove('invalid-move'); }, 350);
                });
            }
            else { moves--; movesDisplay.innerHTML = moves; cascadeDepth = 0; dropSequence(); }
        }, 180);
    } else { if(selectedSquare !== null) { squares[selectedSquare].classList.remove('selected'); selectedSquare = null; } }
}

function createBoard() {
    grid.innerHTML = ''; squares = []; boardTypes = new Array(width * width).fill(-1);
    cascadeDepth = 0;
    isAnimating = true; /* نقفل الإدخال لحد ما التنظيف التلقائي للوحة الأولية يخلص تمامًا، عشان نمنع أي تصادم مع لمسة المستخدم */
    for (let i = 0; i < width * width; i++) {
        const sq = document.createElement('div'); sq.setAttribute('id', i);
        let randomIdx = Math.floor(Math.random() * candyIcons.length);
        sq.style.backgroundImage = candyIcons[randomIdx]; boardTypes[i] = randomIdx;
        sq.style.touchAction = 'none';
        sq.addEventListener('pointerdown', handleInputStart);
        sq.addEventListener('pointerup', handleInputEnd);
        sq.addEventListener('pointercancel', () => { dragStartIndex = null; });
        grid.appendChild(sq); squares.push(sq);
    }
    setTimeout(() => { checkAllMatches(true); }, 100);
}

function swap(i1, i2) {
    const tBg = squares[i1].style.backgroundImage; const tType = boardTypes[i1];
    squares[i1].style.backgroundImage = squares[i2].style.backgroundImage; boardTypes[i1] = boardTypes[i2];
    squares[i2].style.backgroundImage = tBg; boardTypes[i2] = tType;
}

function showFloatingReward(text, matchedSet, isCombo) {
    let firstElementId = Array.from(matchedSet)[0];
    let square = document.getElementById(firstElementId);
    if(!square) return;
    let floatEl = document.createElement('div');
    floatEl.className = 'floating-reward' + (isCombo ? ' combo' : '');
    floatEl.innerHTML = text;
    floatEl.style.left = square.offsetLeft + 'px'; floatEl.style.top = square.offsetTop + 'px';
    document.getElementById('grid').appendChild(floatEl);
    setTimeout(() => { if(floatEl.parentNode) floatEl.parentNode.removeChild(floatEl); }, 1000);
}

function findRuns() {
    let runs = [];
    for (let r = 0; r < width; r++) {
        let c = 0;
        while (c < width) {
            let type = boardTypes[r*width+c];
            if (type === -1) { c++; continue; }
            let runIdx = [r*width+c]; let c2 = c+1;
            while (c2 < width && boardTypes[r*width+c2] === type) { runIdx.push(r*width+c2); c2++; }
            if (runIdx.length >= 3) runs.push({ indices: runIdx, orientation: 'h', type });
            c = c2;
        }
    }
    for (let c = 0; c < width; c++) {
        let r = 0;
        while (r < width) {
            let type = boardTypes[r*width+c];
            if (type === -1) { r++; continue; }
            let runIdx = [r*width+c]; let r2 = r+1;
            while (r2 < width && boardTypes[r2*width+c] === type) { runIdx.push(r2*width+c); r2++; }
            if (runIdx.length >= 3) runs.push({ indices: runIdx, orientation: 'v', type });
            r = r2;
        }
    }
    return runs;
}

/* محرك مطابقة محدّث: تطابق 4 متجاورة يمسح الصف/العمود بالكامل (حلوى مخططة)،
   وتطابق 5+ يمسح كل الحلوى من نفس اللون في اللوحة (قنبلة لونية). تم التأكد من تطابق
   السلوك العادي 100% مع النسخة القديمة عبر 20,000 اختبار عشوائي قبل الدمج. */
function checkMatches(isInit = false) {
    let runs = findRuns();
    if (runs.length === 0) return false;
    let matched = new Set();
    let bigMatchHappened = false; let bombHappened = false;
    runs.forEach(run => {
        run.indices.forEach(i => matched.add(i));
        if (!isInit && run.indices.length >= 4) {
            bigMatchHappened = true;
            if (run.indices.length >= 5) {
                bombHappened = true;
                for (let idx=0; idx<boardTypes.length; idx++) { if (boardTypes[idx] === run.type) matched.add(idx); }
            } else {
                run.indices.forEach(i => {
                    if (run.orientation === 'h') { let r = Math.floor(i/width); for (let c=0;c<width;c++) matched.add(r*width+c); }
                    else { let c = i % width; for (let r=0;r<width;r++) matched.add(r*width+c); }
                });
            }
        }
    });

    if (matched.size > 0) {
        if (!isInit) {
            currentLevelScore += matched.size * 10;
            cascadeMatchCount++;
            if (cascadeMatchCount >= 2) {
                let bonus = (cascadeMatchCount - 1) * 8;
                currentLevelScore += bonus;
                showFloatingReward(`&#x1F525; كومبو x${cascadeMatchCount}`, matched, true);
                playSound('epic_match');
            }
            if(matched.size > (window.userData.bestCombo||0)) {
                window.userData.bestCombo = matched.size;
                set(ref(db, `users/${window.currentUser}/bestCombo`), matched.size).catch(e=>console.log(e));
                checkAchievements();
            }
            if (bombHappened) {
                playSound('epic_match'); fireConfetti(30);
                window.userData.balance += 15;
                update(ref(db, `users/${window.currentUser}`), { balance: window.userData.balance });
                showFloatingReward(`&#x1F4A3; قنبلة لونية! +${STAR}15`, matched, true);
            } else if (bigMatchHappened) {
                playSound('epic_match');
                window.userData.balance += 8;
                update(ref(db, `users/${window.currentUser}`), { balance: window.userData.balance });
                showFloatingReward(`&#x26A1; مسح كامل! +${STAR}8`, matched, true);
            } else if(matched.size >= 4) {
                playSound('epic_match');
                window.userData.balance += 5;
                update(ref(db, `users/${window.currentUser}`), { balance: window.userData.balance });
                showFloatingReward(`+${STAR}5`, matched, true);
            } else { playSound('match'); }
            checkSupportEligibility();
            if(!window.battleMode) { scoreDisplay.innerHTML = fmtStars(window.userData.balance); updateObjectiveBanner(); }
            progressChallenge('score300', currentLevelScore, true);
            if(window.battleMode) { scoreDisplay.innerHTML = currentLevelScore; syncScoreToFirebase(); }
        }
        matched.forEach(x => squares[x].classList.add('fade-out')); return true;
    } return false;
}

function dropSequence(isInit = false) {

    setTimeout(() => {
        squares.forEach((sq, idx) => { if(sq.classList.contains('fade-out')) { sq.style.backgroundImage = ''; boardTypes[idx] = -1; sq.classList.remove('fade-out'); } });
        for (let c = 0; c < width; c++) {
            let eRow = width - 1;
            for (let r = width - 1; r >= 0; r--) {
                let i = r * width + c;
                if (boardTypes[i] !== -1) {
                    if (r !== eRow) {
                        let targetIdx = eRow * width + c;
                        squares[targetIdx].style.backgroundImage = squares[i].style.backgroundImage; boardTypes[targetIdx] = boardTypes[i];
                        squares[i].style.backgroundImage = ''; boardTypes[i] = -1;
                    }
                    eRow--;
                }
            }
            for (let r = eRow; r >= 0; r--) {
                let i = r * width + c;
                let randomIdx = Math.floor(Math.random() * candyIcons.length);
                squares[i].style.backgroundImage = candyIcons[randomIdx]; boardTypes[i] = randomIdx;
                squares[i].classList.add('new-candy'); setTimeout(() => squares[i].classList.remove('new-candy'), 250);
            }
        }
        setTimeout(() => { checkAllMatches(isInit); }, 220);
    }, 130);
}

/* صمام أمان: لو سلسلة الانفجارات المتتالية (كاسكيد) طالت جدًا لأي سبب غير متوقع،
   نوقفها بالقوة ونرجّع اللعبة قابلة للتفاعل تاني بدل ما تفضل "متجمدة" للأبد. */
let cascadeDepth = 0;
let cascadeMatchCount = 0; /* عدّاد الكومبو المتتالي داخل نفس الحركة الواحدة */
const MAX_CASCADE_DEPTH = 40;

function checkAllMatches(isInit = false) {
    cascadeDepth++;
    if (cascadeDepth > MAX_CASCADE_DEPTH) {
        console.warn('تم إيقاف سلسلة الانفجارات المتتالية دفاعيًا بعد', MAX_CASCADE_DEPTH, 'جولة.');
        cascadeDepth = 0; isAnimating = false; return;
    }
    if (checkMatches(isInit)) dropSequence(isInit);
    else {
        isAnimating = false; cascadeDepth = 0;
        if (!isInit && moves <= 0) {
            if(window.battleMode) { endBattleMode(); }
            else {
                if(window.battleEnded) return; window.battleEnded = true;
                window.userData.soloGamesPlayed = (window.userData.soloGamesPlayed || 0) + 1;
                progressChallenge('play3', 1, false);

                let target = targetScoreForLevel(level);
                let stars = currentLevelScore >= target*2.2 ? 3 : currentLevelScore >= target*1.5 ? 2 : currentLevelScore >= target ? 1 : 0;
                let prevStars = (window.userData.levelStars && window.userData.levelStars[level]) || 0;
                if (stars > prevStars) {
                    window.userData.levelStars = window.userData.levelStars || {};
                    window.userData.levelStars[level] = stars;
                    set(ref(db, `users/${window.currentUser}/levelStars/${level}`), stars).catch(e=>console.log(e));
                }

                let prevBestScore = window.userData.bestSoloScore || 0;
                let isNewRecord = currentLevelScore > prevBestScore;
                if (isNewRecord) window.userData.bestSoloScore = currentLevelScore;

                let reward = 5 + stars*10;
                window.userData.balance += reward;
                update(ref(db, `users/${window.currentUser}`), {
                    balance: window.userData.balance,
                    soloGamesPlayed: window.userData.soloGamesPlayed,
                    bestSoloScore: window.userData.bestSoloScore || 0
                }).catch(e=>console.log(e));
                checkAchievements();
                if(!window.battleMode) scoreDisplay.innerHTML = fmtStars(window.userData.balance);

                if (stars >= 1) {
                    level++; window.userData.level = level;
                    update(ref(db, `users/${window.currentUser}`), { level: level }).catch(e=>console.log(e));
                    checkAchievements();
                    playSound('win'); fireConfetti(35);
                    let showTreasure = (level % 5 === 1);
                    AppModal.show({
                        title: isNewRecord ? "رقم قياسي جديد! &#x1F3C6;" : "أحسنت! &#x2705;",
                        html: `<div style="font-size:46px; margin:10px 0;">${renderStars(stars)}</div>
                               <h3 style="color:#8affd6; margin: 5px 0;">النقاط: ${currentLevelScore}</h3>
                               ${isNewRecord ? '<p style="color:#ffc94d;">&#x1F3C6; رقم قياسي شخصي جديد!</p>' : ''}
                               <p>ربحت <strong style="color:#8affd6">+${STAR}${reward}</strong></p>`,
                        confirmText: "المستوى التالي &#x27A1;",
                        onConfirm: () => { if (showTreasure) openTreasureBox(); else window.openLevelMap(true); }
                    });
                } else {
                    playSound('error');
                    AppModal.show({
                        title: "حاول تاني! &#x1F504;",
                        html: `<div style="font-size:46px; margin:10px 0; opacity:0.7;">${renderStars(stars)}</div>
                               <h3 style="color:#ffc94d; margin: 5px 0;">النقاط: ${currentLevelScore}</h3>
                               <p>محتاج <strong style="color:#ff6fa3">${target}</strong> نقطة على الأقل لعبور المستوى.</p>
                               <p style="font-size:13px; color:#8affd6;">ربحت +${STAR}${reward} على المحاولة</p>`,
                        confirmText: "إعادة المحاولة &#x1F501;", onConfirm: initLevel
                    });
                }
            }
        }
    }
}
